<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Soporte | PQR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(57, 255, 20, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 230, 118, 0.20), transparent 35%),
        #f2fbf4;
      color: #112416;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header .icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(135deg, #22c55e, #39ff14);
      color: #052e16;
      font-size: 32px;
      box-shadow: 0 15px 30px rgba(57, 255, 20, 0.35);
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 10px;
      color: #0c1f11;
    }

    .header p {
      color: #4b6852;
      font-size: 16px;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 60px rgba(10, 46, 20, 0.12);
      border: 1px solid rgba(187, 247, 208, 0.9);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 22px;
      color: #14331d;
    }

    .section-title span {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #dcfce7;
      color: #16a34a;
      font-size: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 650;
      margin-bottom: 8px;
      color: #1e4229;
    }

    .required {
      color: #ef4444;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ccebd5;
      background: #fff;
      border-radius: 12px;
      padding: 14px 15px;
      font-size: 15px;
      color: #112416;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(57, 255, 20, 0.22);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
      line-height: 1.5;
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, #4b6852 50%),
        linear-gradient(135deg, #4b6852 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 19px,
        calc(100% - 13px) 19px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .upload-area {
      border: 2px dashed #86efac;
      border-radius: 15px;
      padding: 28px 20px;
      text-align: center;
      background: #f5fdf7;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-area:hover {
      border-color: #22c55e;
      background: #dcfce7;
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.20);
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .upload-area strong {
      display: block;
      color: #1e4229;
      margin-bottom: 5px;
    }

    .upload-area small {
      color: #4b6852;
    }

    #evidencia {
      display: none;
    }

    #file-name {
      margin-top: 10px;
      font-size: 13px;
      color: #16a34a;
      font-weight: 600;
      word-break: break-word;
    }

    .privacy {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 0 25px;
      font-size: 13px;
      color: #4b6852;
      line-height: 1.5;
    }

    .privacy input {
      width: auto;
      margin-top: 3px;
      accent-color: #22c55e;
    }

    .privacy label {
      margin: 0;
      font-weight: 400;
      font-size: 13px;
      color: #4b6852;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #22c55e, #39ff14);
      color: #052e16;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 12px 25px rgba(57, 255, 20, 0.35);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(57, 255, 20, 0.50);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      color: #14532d;
      background: #dcfce7;
      border: 1px solid #4ade80;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fecaca;
    }

    .footer {
      text-align: center;
      color: #6b8e75;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 700px) {
      body {
        padding: 25px 12px;
      }

      .form-card {
        padding: 23px 18px;
        border-radius: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .field.full {
        grid-column: auto;
      }

      .header h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="icon">💬</div>

      <h1>Centro de Soporte</h1>

      <p>
        Envía tu petición, queja, reclamo, sugerencia o solicitud de soporte.
        Estamos aquí para ayudarte.
      </p>
    </div>

    <div class="form-card">

      <form
        id="pqrForm"
        action="https://formspree.io/f/mdegowyz"
        method="POST"
        enctype="multipart/form-data"
      >

        <!-- INFORMACIÓN PERSONAL -->
        <div class="section-title">
          <span>👤</span>
          Información de contacto
        </div>

        <div class="grid">

          <div class="field">
            <label for="nombre">
              Nombre completo <span class="required">*</span>
            </label>

            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Juan Pérez"
              autocomplete="name"
              required
            >
          </div>

          <div class="field">
            <label for="email">
              Correo electrónico <span class="required">*</span>
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="correo@ejemplo.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="telefono">
              Teléfono
            </label>

            <input
              type="tel"
              id="telefono"
              name="telefono"
              placeholder="Ej. +57 300 123 4567"
              autocomplete="tel"
            >
          </div>

          <div class="field">
            <label for="tipo">
              Tipo de solicitud <span class="required">*</span>
            </label>

            <select id="tipo" name="tipo_solicitud" required>
              <option value="">Selecciona una opción</option>
              <option value="Petición">Petición</option>
              <option value="Queja">Queja</option>
              <option value="Reclamo">Reclamo</option>
              <option value="Sugerencia">Sugerencia</option>
              <option value="Felicitación">Felicitación</option>
              <option value="Soporte técnico">Soporte técnico</option>
            </select>
          </div>

        </div>

        <!-- SOLICITUD -->
        <div class="section-title" style="margin-top: 15px;">
          <span>📝</span>
          Detalles de la solicitud
        </div>

        <div class="field">
          <label for="asunto">
            Asunto <span class="required">*</span>
          </label>

          <input
            type="text"
            id="asunto"
            name="asunto"
            placeholder="Escribe brevemente el motivo de tu solicitud"
            required
          >
        </div>

        <div class="field">
          <label for="mensaje">
            Detalle del mensaje <span class="required">*</span>
          </label>

          <textarea
            id="mensaje"
            name="mensaje"
            placeholder="Cuéntanos detalladamente tu solicitud..."
            required
          ></textarea>
        </div>

        <!-- EVIDENCIA -->
        <div class="section-title" style="margin-top: 15px;">
          <span>📎</span>
          Evidencia
        </div>

        <div class="field">

          <label for="evidencia">
            Adjuntar evidencia
          </label>

          <label class="upload-area" for="evidencia">

            <div class="upload-icon">📁</div>

            <strong>
              Haz clic para seleccionar un archivo
            </strong>

            <small>
              Puedes adjuntar imágenes, PDF u otros documentos.
            </small>

            <div id="file-name"></div>

          </label>

          <input
            type="file"
            id="evidencia"
            name="evidencia"
            accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx"
          >

        </div>

        <!-- PRIVACIDAD -->
        <div class="privacy">

          <input
            type="checkbox"
            id="privacy"
            required
          >

          <label for="privacy">
            Confirmo que la información proporcionada es correcta y autorizo
            el tratamiento de mis datos para gestionar esta solicitud.
            <span class="required">*</span>
          </label>

        </div>

        <!-- BOTÓN -->
        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          🚀 Enviar solicitud
        </button>

        <div id="formMessage" class="message"></div>

      </form>

    </div>

    <div class="footer">
      © 2026 Centro de Soporte · Todos los derechos reservados
    </div>

  </div>


  <script>

    const form = document.getElementById("pqrForm");
    const submitBtn = document.getElementById("submitBtn");
    const formMessage = document.getElementById("formMessage");
    const fileInput = document.getElementById("evidencia");
    const fileName = document.getElementById("file-name");


    // Mostrar nombre del archivo seleccionado
    fileInput.addEventListener("change", function () {

      if (this.files.length > 0) {

        const file = this.files[0];

        // Límite de 10 MB
        if (file.size > 10 * 1024 * 1024) {

          fileName.textContent =
            "❌ El archivo supera el límite de 10 MB.";

          fileName.style.color = "#dc2626";

          this.value = "";

          return;
        }

        fileName.textContent =
          "✓ Archivo seleccionado: " + file.name;

        fileName.style.color = "#16a34a";

      } else {

        fileName.textContent = "";

      }

    });


    // Envío del formulario
    form.addEventListener("submit", async function (event) {

      event.preventDefault();

      formMessage.className = "message";
      formMessage.textContent = "";

      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Enviando solicitud...";


      const formData = new FormData(form);


      try {

        const response = await fetch(
          form.action,
          {
            method: "POST",
            body: formData,
            headers: {
              "Accept": "application/json"
            }
          }
        );


        if (response.ok) {

          formMessage.className = "message success";

          formMessage.innerHTML = `
            <strong>✓ Solicitud enviada correctamente</strong><br>
            Hemos recibido tu solicitud. Nuestro equipo revisará
            la información y se pondrá en contacto contigo.
          `;

          form.reset();

          fileName.textContent = "";

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        } else {

          const data = await response.json();

          formMessage.className = "message error";

          if (data.errors) {

            formMessage.textContent =
              data.errors
                .map(error => error.message)
                .join(", ");

          } else {

            formMessage.textContent =
              "No fue posible enviar la solicitud. Inténtalo nuevamente.";

          }

        }

      } catch (error) {

        formMessage.className = "message error";

        formMessage.textContent =
          "Ocurrió un error de conexión. Verifica tu conexión a Internet e inténtalo nuevamente.";

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent = "🚀 Enviar solicitud";

      }

    });

  </script>

</body>
</html>
